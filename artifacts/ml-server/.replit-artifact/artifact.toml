kind = "api"
previewPath = "/ml"
title = "ML Server"
version = "1.0.0"
id = "artifacts/ml-server"

[[services]]
localPort = 8000
name = "ML Server"
paths = ["/ml"]

[services.development]
run = "PORT=8000 python main.py"

[services.production]

[services.production.run]
args = ["python3.11", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "artifacts/ml-server"]

[services.production.run.env]
PORT = "8000"
API_BASE_URL = "http://localhost:8080"

[services.production.health.startup]
path = "/ml/health"
