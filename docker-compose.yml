# Local Postgres for development. Start with `pnpm db:up`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ballboi
      POSTGRES_PASSWORD: ballboi
      POSTGRES_DB: ballboi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ballboi"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
