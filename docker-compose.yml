# Local Postgres and S3-compatible storage for development. Start with `pnpm db:up`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ballboi
      POSTGRES_PASSWORD: ballboi
      POSTGRES_DB: ballboi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ballboi"]
      interval: 2s
      timeout: 3s
      retries: 15

  # SeaweedFS S3 gateway on :8333. Credentials match S3_* in .env.example.
  storage:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -s3.allowedOrigins=* -master.volumeSizeLimitMB=1024
    environment:
      AWS_ACCESS_KEY_ID: ballboi
      AWS_SECRET_ACCESS_KEY: ballboi-local-secret
    ports:
      - "8333:8333"
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  storagedata:
