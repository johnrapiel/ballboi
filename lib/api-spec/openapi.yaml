          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not your match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Couldn't send
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /recording/invites/{code}/claim:
    post:
