  /ball-boi/sessions/{sessionId}/multipart:
    post:
      operationId: startBallBoiMultipartUpload
      tags: [ball-boi]
      summary: Start or resume sending one piece of a recording in parts
      description: >
        Recordings over 5 GB can't go up in one PUT, so every piece of a
        recording is sent as a multipart upload. Calling this again for the
        same piece and size resumes it: the answer lists the parts storage
        already has.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BallBoiMultipartStartBody"
      responses:
        "200":
          description: The piece's upload and the parts already in storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BallBoiMultipartUpload"
        "400":
          description: "Invalid session id, segment or size"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not the person who recorded it"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Session not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Already uploaded (uploaded is true)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadConflict"

