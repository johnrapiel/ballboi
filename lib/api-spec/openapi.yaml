      type: object
      properties:
        round:
          type: string
          enum: [quarterfinal, semifinal, final]
        slot:
          type: integer
        matchId:
          type: ["integer", "null"]
          description: Null until both players are known
        player1:
          oneOf:
            - $ref: "#/components/schemas/BracketSeed"
            - type: "null"
        player2:
          oneOf:
            - $ref: "#/components/schemas/BracketSeed"
            - type: "null"
        status:
          type: string
          description: scheduled, completed, or waiting (no match yet)
        score:
          type: ["string", "null"]
          description: From player 1's side
        winnerId:
          type: ["integer", "null"]
      required: [round, slot, matchId, player1, player2, status, score, winnerId]

