            application/json:
              schema:
                $ref: '#/components/schemas/RecordingConsent'
        '400':
          description: trainingEnabled must be true or false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Couldn't save
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /recording/training:
    put:
      operationId: setRecordingTraining
      tags: [recording]
