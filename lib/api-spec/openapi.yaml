components:
  parameters:
    LeagueIdParam:
      name: leagueId
      in: path
      required: true
      schema:
        type: integer
    RoundIdParam:
      name: roundId
      in: path
      required: true
      schema:
        type: integer
    RequestIdParam:
      name: requestId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    LeagueMembership:
      type: object
      properties:
        leagueId:
          type: integer
        role:
          type: ["string", "null"]
          enum: [owner, co_admin, null]
        isAdmin:
          type: boolean
        playerId:
          type: ["integer", "null"]
        isPlaying:
          type: boolean
        hasLeft:
          type: boolean
      required: [leagueId, role, isAdmin, playerId, isPlaying, hasLeft]

    LeagueAdmin:
      type: object
      properties:
        clerkUserId:
          type: string
        role:
          type: string
          enum: [owner, co_admin]
        playerId:
          type: ["integer", "null"]
        name:
          type: string
      required: [clerkUserId, role, playerId, name]

    RosterPlayer:
      type: object
      properties:
        playerId:
          type: integer
        name:
          type: string
        skillLevel:
          type: string
        hasAccount:
          type: boolean
          description: False for players an admin added by name; they can't be co-admins
        role:
          type: ["string", "null"]
          enum: [owner, co_admin, null]
      required: [playerId, name, skillLevel, hasAccount, role]

    PlayerIdBody:
      type: object
      properties:
        playerId:
          type: integer
      required: [playerId]

    SwapPlayersBody:
      type: object
      properties:
        playerAId:
          type: integer
        playerBId:
          type: integer
      required: [playerAId, playerBId]

    LockMatchBody:
      type: object
      properties:
        locked:
          type: boolean
      required: [locked]

    EnterScoreBody:
      type: object
      properties:
        score:
          type: string
          description: Sets from your own side, like "6-3, 4-6, 10-7". Your games first.
      required: [score]

    ScoreResult:
      type: object
      properties:
        matchId:
          type: integer
        status:
          type: string
        score:
          type: ["string", "null"]
          description: Stored from player 1's side
        winnerId:
          type: ["integer", "null"]
        inGrace:
          type: boolean
          description: Scored in the grace week; counts for ratings and stats, not standings
        countsForStandings:
          type: boolean
      required: [matchId, status, score, winnerId, inGrace, countsForStandings]

    SchedulePlayer:
      type: object
      properties:
        playerId:
          type: integer
        playerName:
          type: string
      required: [playerId, playerName]

    ScheduleBye:
      type: object
      properties:
        playerId:
          type: integer
        playerName:
          type: string
        setByAdmin:
          type: boolean
      required: [playerId, playerName, setByAdmin]

    ScheduleMatch:
      type: object
      properties:
        matchId:
          type: integer
        player1Id:
          type: integer
        player1Name:
          type: string
        player2Id:
          type: integer
        player2Name:
          type: string
        status:
          type: string
        score:
          type: ["string", "null"]
          description: From player 1's side
        winnerId:
          type: ["integer", "null"]
        inGrace:
          type: boolean
        voided:
          type: boolean
        locked:
          type: boolean
        scheduledAt:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
      required: [matchId, player1Id, player1Name, player2Id, player2Name, status, score, winnerId, inGrace, voided, locked, scheduledAt, location]

    ScheduleRound:
      type: object
      properties:
        roundId:
          type: integer
        roundNumber:
          type: integer
        startDate:
          type: string
        deadline:
          type: string
          description: Last day to play for standings
        graceEnd:
          type: string
          description: Last day of the grace week
        phase:
          type: string
          enum: [draft, upcoming, open, grace, closed]
        matches:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleMatch"
        byes:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleBye"
        unpaired:
          type: array
          description: Admins, drafts only. Players with no match or bye yet.
          items:
            $ref: "#/components/schemas/SchedulePlayer"
      required: [roundId, roundNumber, startDate, deadline, graceEnd, phase, matches, byes, unpaired]

    ScheduleWeek:
      type: object
      properties:
        roundNumber:
          type: integer
        startDate:
          type: string
        deadline:
          type: string
        graceEnd:
          type: string
      required: [roundNumber, startDate, deadline, graceEnd]

    LeagueSchedule:
      type: object
      properties:
        leagueId:
          type: integer
        today:
          type: string
          description: Today's date in the league's time zone
        timeZone:
          type: string
        weeklyRounds:
          type: boolean
        isAdmin:
          type: boolean
        rounds:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleRound"
        upcoming:
          type: array
          description: Weeks this season with no round yet
          items:
            $ref: "#/components/schemas/ScheduleWeek"
      required: [leagueId, today, timeZone, weeklyRounds, isAdmin, rounds, upcoming]

    JoinRequest:
      type: object
      properties:
        id:
          type: integer
        leagueId:
          type: integer
        playerName:
          type: string
        skillLevel:
          type: string
        kind:
          type: string
          enum: [request, waitlist]
        status:
          type: string
          enum: [pending, approved, declined, withdrawn]
        createdAt:
          type: string
        message:
          type: string
      required: [id, leagueId, playerName, skillLevel, kind, status, createdAt]

    ApprovedPlayer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        leagueId:
          type: integer
      required: [id, name, leagueId]

    DropoutResult:
      type: object
      properties:
        left:
          type: boolean
        removed:
          type: boolean
        voidedMatches:
          type: integer
      required: [voidedMatches]

    Season:
      type: object
      properties:
        id:
          type: integer
        leagueId:
          type: ["integer", "null"]
        name:
          type: string
        startDate:
          type: string
          description: ISO date YYYY-MM-DD
        endDate:
          type: string
          description: ISO date YYYY-MM-DD
        isActive:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - leagueId
        - name
        - startDate
        - endDate
        - isActive
        - createdAt
        - updatedAt

    CreateSeasonBody:
      type: object
      properties:
        name:
          type: string
        startDate:
          type: string
          description: ISO date YYYY-MM-DD
        endDate:
          type: string
