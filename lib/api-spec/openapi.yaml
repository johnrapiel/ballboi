                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Couldn't load
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /recording/invites/{code}/not-me:
    post:
      operationId: answerNotMe
