          type: array
          items:
            $ref: "#/components/schemas/BracketSlot"
        playBy:
          type: ["string", "null"]
          description: >-
            Last day to play this round (YYYY-MM-DD, league time zone): two weeks, a play week
            plus a grace week. Null for leagues without the weekly calendar.
        pastPlayBy:
          type: boolean
          description: The play-by date has passed. Players can't enter a score; an admin settles the match.
      required: [round, slots, playBy, pastPlayBy]

    LeagueBracket:
      type: object
      properties:
        bracketId:
          type: integer
        status:
          type: string
          enum: [active, completed]
        size:
          type: integer
          enum: [4, 8]
        seeds:
          type: array
          items:
            $ref: "#/components/schemas/BracketSeed"
        rounds:
          type: array
          items:
            $ref: "#/components/schemas/BracketRound"
        champion:
          oneOf:
            - $ref: "#/components/schemas/BracketSeed"
            - type: "null"
      required: [bracketId, status, size, seeds, rounds, champion]

    SchedulePlayer:
      type: object
      properties:
        playerId:
          type: integer
        playerName:
          type: string
      required: [playerId, playerName]

    ScheduleBye:
      type: object
      properties:
        playerId:
          type: integer
        playerName:
          type: string
        setByAdmin:
          type: boolean
      required: [playerId, playerName, setByAdmin]

    EditedScore:
      type: object
      properties:
        matchId: { type: integer }
        score:
          type: string
          description: From player 1's side
        winnerId: { type: ["integer", "null"] }
        editedAt: { type: string }
        editedBy: { type: string }
      required: [matchId, score, winnerId, editedAt, editedBy]

    MatchDetailPlayer:
      type: object
      properties:
        playerId: { type: integer }
        name: { type: string }
        you: { type: boolean }
        hasAccount: { type: boolean }
      required: [playerId, name, you, hasAccount]

    MatchDetailSide:
      type: object
      properties:
        players:
          type: array
          items: { $ref: "#/components/schemas/MatchDetailPlayer" }
        won: { type: boolean }
      required: [players, won]

    MatchDetailReplay:
      type: object
      properties:
        durationSeconds: { type: ["integer", "null"] }
        shotCount: { type: integer }
      required: [durationSeconds, shotCount]

    MatchDetail:
      type: object
      properties:
        matchId: { type: integer }
        leagueId: { type: integer }
        leagueName: { type: string }
        singles: { type: boolean }
        timeZone: { type: ["string", "null"] }
        roundNumber: { type: ["integer", "null"] }
        playoffRound: { type: ["string", "null"] }
        scheduledAt: { type: ["string", "null"] }
        completedAt: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        played: { type: boolean }
        voided: { type: boolean }
        inGrace: { type: boolean }
        score:
          type: ["string", "null"]
          description: From your side, your games first
        you: { $ref: "#/components/schemas/MatchDetailSide" }
        opponents: { $ref: "#/components/schemas/MatchDetailSide" }
        enteredBy:
          type: ["string", "null"]
          description: The player who first entered the score; null when the league admin did
        enteredAt: { type: ["string", "null"] }
        editUntil:
          type: ["string", "null"]
          description: When your 24 hours to edit the score run out (ISO time); null when you can't edit it
        editedBy:
          type: ["string", "null"]
          description: The player who last edited the score, for "Score edited by {name}"
        editedAt: { type: ["string", "null"] }
        correctedBy: { type: ["string", "null"] }
