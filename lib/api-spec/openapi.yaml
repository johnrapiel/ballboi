          type: boolean
        player2HasAccount:
          type: boolean
        status:
          type: string
        score:
          type: ["string", "null"]
          description: From player 1's side
        winnerId:
          type: ["integer", "null"]
        inGrace:
          type: boolean
        voided:
          type: boolean
        locked:
          type: boolean
        scheduledAt:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        undoUntil:
          type: ["string", "null"]
          description: When the caller's 10-minute undo runs out (ISO time). Set only for the player who entered the score, while they can still undo it.
        correctedBy:
          type: ["string", "null"]
          description: The admin who corrected the score, for "Corrected by {admin} on {date}"
        correctedAt:
          type: ["string", "null"]
        scoreClearedBy:
          type: ["string", "null"]
          description: The player who undid the score, shown to the opponent until a new score is in
      required: [matchId, player1Id, player1Name, player2Id, player2Name, player1Rating, player2Rating, player1HasAccount, player2HasAccount, status, score, winnerId, inGrace, voided, locked, scheduledAt, location, undoUntil, correctedBy, correctedAt, scoreClearedBy]

    MatchPlayerRating:
      type: object
      description: A player's level and where it came from, for the level badge. "self" is their self-rated level from Edit profile; "verified" is for a future linked rating source
      properties:
