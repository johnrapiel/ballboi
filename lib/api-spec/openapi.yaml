openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Tennis League Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: dev
    description: Development-only walkthrough tools. Not available in production.
  - name: health
    description: Health operations
  - name: leagues
    description: League management
  - name: players
    description: Player management
  - name: matches
    description: Match scheduling and results
  - name: availability
    description: Player availability and reminder operations
  - name: stats
    description: Statistics and analytics
  - name: users
    description: User profile management
  - name: ball-boi
    description: Ball Boi match recording and replay analysis
  - name: rounds
    description: Round-based match scheduling
  - name: seasons
    description: Season management
  - name: safety
    description: Blocking and reporting
  - name: moderation
    description: The moderator's tools. Only the app's moderator account can use them.
  - name: account
    description: Ban and suspension status and the one appeal. These work while banned.
  - name: messages
    description: Player-to-player messages
  - name: recording
    description: Recording consent, Quick matches and the recordings list
  - name: notifications
    description: Push notification registration
  - name: storage
    description: Profile photo uploads and loads
  - name: discover
    description: Players near you and your Discover settings
  - name: courts
    description: The court directory and your home court
  - name: matchRequests
    description: Match requests between Discover players

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /leagues:
    get:
      operationId: getLeagues
      tags: [leagues]
      summary: List all leagues
      parameters:
        - name: clerkUserId
          in: query
          required: false
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of leagues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/League"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createLeague
      tags: [leagues]
      summary: Create a new league
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeagueBody"
      responses:
        "201":
          description: Created league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{leagueId}:
    get:
      operationId: getLeague
      tags: [leagues]
      summary: Get league by ID
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: League
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateLeague
      tags: [leagues]
      summary: Update league
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeagueBody"
      responses:
        "200":
          description: Updated league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteLeague
      tags: [leagues]
      summary: League admins delete the league, with its name typed. Members get a note; Ball Boi recordings stay with the players.
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmLeagueName"
      responses:
        "204":
          description: Deleted
        "400":
          description: The typed name doesn't match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a league admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{leagueId}/reset:
    post:
      operationId: resetLeagueRecords
      tags: [leagues]
      summary: Reset round scheduling history for a league (admin only). Match history is preserved.
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rounds reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: object
                    properties:
                      rounds:
                        type: integer
                    required: [rounds]
                required: [deleted]
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{leagueId}/playoffs/generate:
    post:
      operationId: generateLeaguePlayoffs
      tags: [leagues]
      summary: Generate a playoff bracket for a league (admin only)
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Bracket generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayoffBracketResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{leagueId}/playoffs:
    get:
      operationId: getLeaguePlayoffs
      tags: [leagues]
      summary: Get the playoff bracket and eligibility status for a league
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Playoff status including bracket (or null) and eligibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayoffsStatusResponse"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{leagueId}/rounds/generate:
    post:
      operationId: generateLeagueRound
      tags: [rounds]
      summary: Generate next round of matchups for a league (admin only)
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: Force generation even if a round is still active
      responses:
        "201":
          description: Round generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueRoundWithMatchups"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A round is already active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{leagueId}/rounds/current:
    get:
      operationId: getCurrentLeagueRound
      tags: [rounds]
      summary: Get the current active round for a league
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Current round or null if no active round
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LeagueRoundWithMatchups"
                  - type: "null"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{leagueId}/rounds:
    get:
      operationId: getLeagueRounds
      tags: [rounds]
      summary: List all rounds for a league
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of rounds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeagueRoundWithMatchups"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{leagueId}/seasons:
    get:
      operationId: getLeagueSeasons
      tags: [seasons]
      summary: List seasons visible to a league (own + global)
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of seasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Season"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createLeagueSeason
      tags: [seasons]
      summary: Create a season for a league (admin only)
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSeasonBody"
      responses:
        "201":
          description: Created season
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Not possible in the current state"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{leagueId}/seasons/active:
    get:
      operationId: getActiveLeagueSeason
      tags: [seasons]
      summary: Get the currently active season for a league
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Active season or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Season"
                  - type: "null"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /seasons/{id}:
    patch:
      operationId: updateSeason
      tags: [seasons]
      summary: Update a season (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSeasonBody"
      responses:
        "200":
          description: Updated season
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Not possible in the current state"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSeason
      tags: [seasons]
      summary: Delete a season (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{leagueId}/standings:
    get:
      operationId: getLeagueStandings
      tags: [leagues]
      summary: Get standings for a league
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
        - name: season
          in: query
          required: false
          description: Filter by season name, or "all" for all-time aggregate
          schema:
            type: string
      responses:
        "200":
          description: Standings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Standing"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /players:
    get:
      operationId: getPlayers
      tags: [players]
      summary: List all players
      parameters:
        - name: leagueId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /players/me:
    get:
      operationId: getMyPlayers
      tags: [players]
      summary: List player records linked to the current user
      responses:
        "200":
          description: Current user's player records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /players/{playerId}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Get player by ID
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePlayer
      tags: [players]
      summary: Update player
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlayerBody"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Not possible in the current state"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePlayer
      tags: [players]
      summary: Delete player
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Not possible in the current state"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /players/{playerId}/stats:
    get:
      operationId: getPlayerStats
      tags: [players]
      summary: Get detailed stats for a player
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerStats"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{leagueId}/membership:
    get:
      operationId: getLeagueMembership
      tags: [leagues]
      summary: The signed-in user's admin role and player row in a league
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
      responses:
        "200":
          description: Membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueMembership"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{leagueId}/admins:
    get:
      operationId: getLeagueAdmins
      tags: [leagues]
      summary: The league's owner and co-admins
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
      responses:
        "200":
          description: Admins, owner first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeagueAdmin"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: promoteLeagueAdmin
      tags: [leagues]
      summary: Promote a league member to co-admin (admins only)
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerIdBody"
      responses:
        "201":
          description: Promoted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueAdmin"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{leagueId}/roster:
    get:
      operationId: getLeagueRoster
      tags: [leagues]
      summary: Everyone playing this season, with their admin role (admins only)
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
      responses:
        "200":
          description: Active players by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RosterPlayer"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
