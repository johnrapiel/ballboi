        '400':
          description: trainingEnabled missing, or your own invite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not a valid invite link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Someone already joined with this link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Couldn't add the match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /recording/todays-matches:
    get:
      operationId: getTodaysRecordableMatches
      tags: [recording]
      summary: Matches the person can record in the window (the phone's local day), most fitting first
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          description: ISO 8601 date and time
      - name: to
        in: query
        required: true
        schema:
          type: string
          description: ISO 8601 date and time
      responses:
        '200':
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecordableMatch'
        '400':
          description: from and to missing, or more than 48 hours apart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Couldn't load
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /recording/sessions:
    get:
      operationId: getMyRecordings
      tags: [recording]
      summary: Recent recordings of the person's matches, newest first, whoever recorded them. Both players see a match's card.
      responses:
        '200':
          description: Recordings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecordingListItem'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Couldn't load
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /recording/doubles-views:
    post:
      operationId: logDoublesView
      tags: [recording]
      summary: Count that someone saw the doubles-is-coming note on a doubles match, once per match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                matchId:
                  type: integer
              required: [matchId]
      responses:
        '204':
          description: Counted
        '400':
          description: matchId is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Couldn't log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /recording/discard:
    post:
      operationId: discardRecording
      tags: [recording]
      summary: Discard a recording that never uploaded, and a Quick match with nothing else in it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                matchId:
                  type: integer
                sessionId:
                  type: integer
              required: [matchId]
      responses:
        '200':
          description: Discarded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscardResult'
        '400':
          description: matchId missing or sessionId not a number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not a player in the match, or not the person who recorded it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The recording already uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Couldn't discard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /recording/sessions/{sessionId}/remove:
    post:
      operationId: removeRecording
      tags: [recording]
      summary: Remove a recording whose analysis failed or whose upload never finished. The recorder deletes it for both players; the other player takes it off their own list.
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Removed (also when it was already gone)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingRemoved'
        '400':
          description: Invalid recording id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not a player in the match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Analyzing or ready, so it can't be removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Couldn't remove
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /recording/quick-matches/{matchId}/abandon:
    post:
      operationId: abandonQuickMatch
      tags: [recording]
      summary: Remove a Quick match left before recording it, with its placeholder opponent and invite
      parameters:
      - name: matchId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Removed (also when it was already gone)
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed:
                    type: boolean
                    enum: [true]
                required: [removed]
        '400':
          description: Invalid match id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not the player who started the match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Not a Quick match, or it has a recording or a score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Couldn't remove
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    LeagueIdParam:
      name: leagueId
      in: path
      required: true
      schema:
        type: integer
    RoundIdParam:
      name: roundId
      in: path
      required: true
      schema:
        type: integer
    RequestIdParam:
      name: requestId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    AddedCourt:
      allOf:
      - $ref: '#/components/schemas/CourtCard'
      - type: object
        properties:
          existing:
            type: boolean
            description: The court was already in the directory
        required: [existing]
    CourtCard:
      type: object
      properties:
        courtId:
          type: integer
        name:
          type: string
        address:
          type: string
        distance:
          type: [string, 'null']
          description: '"~3 mi", or null with no home area'
      required: [courtId, name, address, distance]
    CourtList:
      type: object
      properties:
        courts:
          type: array
          items:
            $ref: '#/components/schemas/CourtCard'
        homeCourtId:
          type: [integer, 'null']
      required: [courts, homeCourtId]
    DiscoverArea:
      type: object
      description: Your home ZIP and its town. Others only ever see the town and an approximate distance.
      properties:
        zip:
          type: string
        town:
          type: string
        state:
          type: string
      required: [zip, town, state]
    DiscoverAreaInput:
      type: object
      properties:
        zip:
          type: string
          description: Five digits
      required: [zip]
    DiscoverAvailabilityInput:
      type: object
      properties:
        slots:
          type: array
          description: Free hours, each day * 24 + hour. Monday is day 0; hours 6 (6 AM) to 21 (9 PM).
          items:
            type: integer
      required: [slots]
    DiscoverLeague:
      type: object
      properties:
        leagueId:
          type: integer
        name:
          type: string
        organizerName:
          type: string
        location:
          type: [string, 'null']
        distance:
          type: [string, 'null']
        format:
          type: string
        type:
          type: string
        levelText:
          type: string
        outsideLevel:
          type: boolean
        myRating:
          type: [number, 'null']
        startDate:
          type: [string, 'null']
        startLabel:
          type: [string, 'null']
        seasonWeeks:
          type: [integer, 'null']
        started:
          type: boolean
        full:
          type: boolean
        rosterCap:
          type: [integer, 'null']
        spotsTaken:
          type: integer
        spotsLeft:
          type: [integer, 'null']
        joining:
          type: string
          enum: [request, waitlist]
        myRequest:
          $ref: '#/components/schemas/DiscoverLeagueRequest'
        member:
          type: boolean
      required: [leagueId, name, organizerName, location, distance, format, type, levelText, outsideLevel, myRating, startDate, startLabel, seasonWeeks, started, full, rosterCap, spotsTaken, spotsLeft, joining, myRequest, member]
    DiscoverLeagueCard:
      type: object
      properties:
        leagueId:
          type: integer
        name:
          type: string
        detail:
          type: string
        status:
          type: string
        tags:
          type: array
          items:
            type: string
            enum: [outside_level, full, started]
        joining:
          type: string
          enum: [request, waitlist]
        myRequest:
          $ref: '#/components/schemas/DiscoverLeagueRequest'
        spoken:
          type: string
      required: [leagueId, name, detail, status, tags, joining, myRequest, spoken]
    DiscoverLeagueRequest:
      oneOf:
      - type: object
        properties:
          kind:
            type: string
            enum: [request, waitlist]
          status:
            type: string
            enum: [pending, declined]
        required: [kind, status]
      - type: 'null'
    DiscoverLeagues:
      type: object
      properties:
        leagues:
          type: array
          items:
            $ref: '#/components/schemas/DiscoverLeagueCard'
        counts:
          type: array
          items:
            type: object
            properties:
              radius:
                type: integer
              count:
                type: integer
            required: [radius, count]
        radius:
          type: integer
        total:
          type: integer
        needsArea:
          type: boolean
      required: [leagues, counts, radius, total, needsArea]
    DiscoverMe:
      type: object
      properties:
        area:
          oneOf:
          - $ref: '#/components/schemas/DiscoverArea'
          - type: 'null'
        homeZip:
          type: [string, 'null']
        hidden:
          type: boolean
          description: Show me in Discover is off
        plays:
          type: [string, 'null']
          enum: [singles, doubles, both, null]
        radius:
          type: integer
          description: Last distance picked, 1 to 30 miles
        rating:
          type: [number, 'null']
        slots:
          type: array
          items:
            type: integer
        hoursFree:
          type: integer
        freeSummary:
          type: [string, 'null']
          description: '"Weekday evenings, weekend mornings", or null with no hours set'
        matchAlerts:
          type: boolean
          description: Alerts for new open matches near you, up to 2 a day
      required: [area, homeZip, hidden, plays, radius, rating, slots, hoursFree, freeSummary, matchAlerts]
    DiscoverPlayerCard:
      type: object
      properties:
        userId:
          type: integer
        name:
          type: string
        avatarUrl:
          type: [string, 'null']
        rating:
          type: [number, 'null']
        ratingSource:
          type: [string, 'null']
        town:
          type: [string, 'null']
        distance:
          type: [string, 'null']
          description: '"~4 mi away"'
        plays:
          type: [string, 'null']
          enum: [singles, doubles, both, null]
        freeSummary:
          type: [string, 'null']
        homeCourt:
          type: [string, 'null']
        played:
          type: integer
        noShows:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
      required: [userId, name, avatarUrl, rating, ratingSource, town, distance, plays, freeSummary, homeCourt, played, noShows, wins, losses]
    DiscoverPlayerRow:
      type: object
      properties:
        userId:
          type: integer
        name:
          type: string
        avatarUrl:
          type: [string, 'null']
        rating:
          type: [number, 'null']
        ratingSource:
          type: [string, 'null']
        distance:
          type: string
          description: '"~4 mi"'
        plays:
          type: [string, 'null']
          enum: [singles, doubles, both, null]
        played:
          type: integer
        noShows:
          type: integer
        reliability:
          type: string
          description: '"Played 14 · 1 no-show" or "New to Ball Boi"'
        spoken:
          type: string
          description: The whole row in one line for VoiceOver
      required: [userId, name, avatarUrl, rating, ratingSource, distance, plays, played, noShows, reliability, spoken]
    DiscoverPlayers:
      type: object
      properties:
        players:
          type: array
          items:
            $ref: '#/components/schemas/DiscoverPlayerRow'
        counts:
          type: array
          description: Players at each distance chip (5, 10, 15, 30 and a custom distance), with the other filters as they are
          items:
            type: object
            properties:
              radius:
                type: integer
              count:
                type: integer
            required: [radius, count]
        radius:
          type: integer
        total:
          type: integer
        needsArea:
          type: boolean
          description: You have no home ZIP Discover can place yet
      required: [players, counts, radius, total, needsArea]
    DiscoverReportInput:
      type: object
      properties:
        reason:
          type: string
          enum: [harassment, inappropriate_content, spam, cheating, unsafe, other]
        details:
          type: [string, 'null']
          description: Required for other ("Tell us what happened")
        block:
          type: boolean
          description: Also block them
      required: [reason]
    DiscoverReportResult:
      type: object
