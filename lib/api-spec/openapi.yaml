          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BallBoiUploadUrl"
        "400":
          description: "Invalid session id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not the person who recorded it"
          content:
            application/json:
              schema:
