      properties:
        leagueId: { type: integer }
        leagueName: { type: string }
        matchId: { type: integer }
        opponentName: { type: string }
        score:
          type: string
          description: From the viewer's side, their games first
        won: { type: boolean }
        inGrace: { type: boolean }
        playoff: { type: boolean }
        completedAt: { type: ["string", "null"] }
      required: [leagueId, leagueName, matchId, opponentName, score, won, inGrace, playoff, completedAt]

    LeagueWeek:
      type: object
      properties:
        today: { type: string }
