        correctedBy: { type: string }
      required: [matchId, score, winnerId, correctedAt, correctedBy]

    ScheduleMatch:
      type: object
      properties:
        matchId:
          type: integer
        player1Id:
          type: integer
        player1Name:
          type: string
        player2Id:
          type: integer
        player2Name:
          type: string
        player1Rating:
          oneOf:
            - $ref: "#/components/schemas/MatchPlayerRating"
            - type: "null"
        player2Rating:
          oneOf:
            - $ref: "#/components/schemas/MatchPlayerRating"
            - type: "null"
