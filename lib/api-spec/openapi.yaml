            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Couldn't save
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /recording/invites/{code}:
