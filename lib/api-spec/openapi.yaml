          type: integer
          enum: [4, 8]
        seeds:
          type: array
          items:
            $ref: "#/components/schemas/BracketSeed"
        rounds:
          type: array
          items:
            $ref: "#/components/schemas/BracketRound"
        champion:
          oneOf:
            - $ref: "#/components/schemas/BracketSeed"
            - type: "null"
      required: [bracketId, status, size, seeds, rounds, champion]

