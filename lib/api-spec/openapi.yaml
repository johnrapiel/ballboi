          type: array
          items: { $ref: "#/components/schemas/LeagueWeekItem" }
        playoffs:
          type: array
          items: { $ref: "#/components/schemas/LeagueWeekPlayoff" }
        drafts:
          type: array
          items: { $ref: "#/components/schemas/LeagueWeekDraft" }
        recent:
          type: array
          description: Your last five results
          items: { $ref: "#/components/schemas/LeagueWeekResult" }
        results:
          type: array
          description: Every result, newest first, for My matches
          items: { $ref: "#/components/schemas/LeagueWeekResult" }
        season: { $ref: "#/components/schemas/LeagueWeekSeason" }
        leagues:
          type: array
          description: Leagues you play in that are still running, with where you stand
          items: { $ref: "#/components/schemas/LeagueWeekLeague" }
      required: [today, thisWeek, playoffs, drafts, recent, results, season, leagues]

    LeagueWeekSeason:
      type: object
      description: Your results across leagues still running
      properties:
        wins: { type: integer }
        losses: { type: integer }
        played: { type: integer }
