components:
  parameters:
    LeagueIdParam:
      name: leagueId
      in: path
      required: true
      schema:
        type: integer
    RoundIdParam:
      name: roundId
      in: path
      required: true
      schema:
        type: integer
    RequestIdParam:
      name: requestId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    MatchRequestWhen:
      type: object
      properties:
        date:
          type: string
          description: YYYY-MM-DD
        windowStart:
          type: string
          description: HH:MM on the hour or half hour
        windowEnd:
          type: string
          description: HH:MM, after the start, up to 6 hours later
      required: [date, windowStart, windowEnd]
    NewMatchRequest:
      allOf:
      - $ref: '#/components/schemas/MatchRequestWhen'
      - type: object
        properties:
          toUserId:
            type: integer
          timeZone:
            type: string
            description: The phone's IANA time zone
          courtId:
            type: [integer, 'null']
          kind:
            type: string
            enum: [singles, practice]
          note:
            type: [string, 'null']
            maxLength: 200
        required: [toUserId, timeZone]
    MatchRequest:
      type: object
      properties:
        requestId:
          type: integer
        phase:
          type: string
          enum: [waiting_on_you, waiting_on_them, upcoming, to_confirm, started, declined, withdrawn, cancelled, expired]
        actions:
          type: array
          items:
            type: string
            enum: [accept, counter, decline, withdraw, confirm, cancel, no_show]
        kind:
          type: string
          enum: [singles, practice]
        when:
          type: string
          description: Like "Sat, Nov 8, 9 to 11 AM", in the request's time zone
        date:
          type: string
        windowStart:
          type: string
        windowEnd:
          type: string
        timeZone:
          type: string
        startsAt:
          type: string
          format: date-time
        court:
          oneOf:
          - $ref: '#/components/schemas/HomeCourt'
          - type: 'null'
        note:
          type: [string, 'null']
        other:
          type: object
          properties:
            userId:
              type: [integer, 'null']
            name:
              type: string
          required: [userId, name]
        sentByMe:
          type: boolean
        counters:
          type: integer
        matchId:
          type: [integer, 'null']
        scoreEntered:
          type: boolean
        youConfirmed:
          type: boolean
        theyConfirmed:
          type: boolean
        noShow:
          type: [string, 'null']
          enum: [you, them, null]
      required: [requestId, phase, actions, kind, when, date, windowStart, windowEnd, timeZone, startsAt, court, note, other, sentByMe, counters, matchId, scoreEntered, youConfirmed, theyConfirmed, noShow]
    MatchRequestList:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/MatchRequest'
      required: [requests]
    HomeCourt:
      type: object
      properties:
        courtId:
          type: integer
        name:
          type: string
      required: [courtId, name]
    HomeCourtInput:
      type: object
      properties:
        courtId:
          type: [integer, 'null']
          description: Null clears it
      required: [courtId]
    HomeCourtSaved:
      type: object
      properties:
        homeCourtId:
          type: [integer, 'null']
      required: [homeCourtId]
    CourtCard:
      type: object
      properties:
        courtId:
          type: integer
        name:
          type: string
        place:
          type: [string, 'null']
          description: Cross streets or park, like "Riverside Park, W 96th St"
        access:
          type: string
          enum: [public, club]
        surface:
          type: [string, 'null']
          enum: [hard, clay, grass, other, null]
        lights:
          type: [boolean, 'null']
        courtCount:
          type: [integer, 'null']
        distanceLabel:
          type: string
          description: Approximate, like "~2 mi away"
      required: [courtId, name, place, access, surface, lights, courtCount, distanceLabel]
    AddedCourt:
      allOf:
      - $ref: '#/components/schemas/CourtCard'
      - type: object
        properties:
          existing:
            type: boolean
            description: True when the court was already in the directory
        required: [existing]
    CourtList:
      type: object
      properties:
        radius:
          type: integer
        homeAreaProblem:
          type: [string, 'null']
        homeCourtId:
          type: [integer, 'null']
        courts:
          type: array
          items:
            $ref: '#/components/schemas/CourtCard'
      required: [radius, homeAreaProblem, homeCourtId, courts]
    NewCourt:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 60
        place:
          type: [string, 'null']
          maxLength: 80
        zip:
          type: string
          pattern: '^[0-9]{5}$'
        latitude:
          type: number
          description: Optional, from "I'm at the court". Used only when it's near the zip.
        longitude:
          type: number
        access:
          type: string
          enum: [public, club]
        surface:
          type: [string, 'null']
          enum: [hard, clay, grass, other, null]
        lights:
          type: [boolean, 'null']
        courtCount:
          type: [integer, 'null']
          minimum: 1
          maximum: 60
      required: [name, zip]
    CourtHidden:
      type: object
      properties:
        courtId:
          type: integer
        hidden:
          type: boolean
      required: [courtId, hidden]
    OpenLeagueCard:
      type: object
      properties:
        leagueId:
          type: integer
        name:
          type: string
        format:
          type: string
          enum: [flex, round_robin]
        levelRange:
          type: string
          description: Like "3.0 to 4.0", "3.5 and up", "Up to 4.0" or "All levels"
        startDate:
          type: [string, 'null']
          description: YYYY-MM-DD
        distanceLabel:
          type: string
          description: Approximate, like "~6 mi away"
        spotsLeft:
          type: [integer, 'null']
          description: Null when the league has no roster cap
        joining:
          type: string
          enum: [join, waitlist]
          description: "join: a request goes to the admin now. waitlist: started or full, so it waits for next season"
        myRequest:
          type: [string, 'null']
          enum: [request, waitlist, null]
          description: Your pending request or waitlist spot
      required: [leagueId, name, format, levelRange, startDate, distanceLabel, spotsLeft, joining, myRequest]
    DiscoverLeagues:
      type: object
      properties:
        radius:
          type: integer
        homeAreaProblem:
          type: [string, 'null']
        leagues:
          type: array
          items:
            $ref: '#/components/schemas/OpenLeagueCard'
      required: [radius, homeAreaProblem, leagues]
    DiscoverLeaguePreview:
      allOf:
      - $ref: '#/components/schemas/OpenLeagueCard'
      - type: object
        properties:
          description:
            type: [string, 'null']
          seasonWeeks:
            type: [integer, 'null']
          endDate:
            type: [string, 'null']
          playoffSize:
            type: integer
          matchDay:
            type: [integer, 'null']
            description: 0 Sunday to 6 Saturday, when the league has a set match time
          matchTime:
            type: [string, 'null']
            description: 24-hour HH:MM in the league's time zone
          timeZone:
            type: string
          players:
            type: integer
            description: Players in the league now
          rosterCap:
            type: [integer, 'null']
          adminName:
            type: [string, 'null']
            description: Who runs it
        required: [description, seasonWeeks, endDate, playoffSize, matchDay, matchTime, timeZone, players, rosterCap, adminName]
    DiscoverFilters:
      type: object
      properties:
        radius:
          type: integer
          enum: [5, 10, 15, 30]
        level:
          type: string
          enum: [near, wider, any]
        plays:
          type: string
          enum: [any, singles, doubles]
        free:
          type: string
          enum: [any, weekday_mornings, weekday_evenings, weekends]
      required: [radius, level, plays, free]
    DiscoverPlayerCard:
      type: object
      properties:
        userId:
          type: integer
        name:
          type: string
        avatarUrl:
          type: [string, 'null']
        rating:
          type: [number, 'null']
        ratingSource:
          type: [string, 'null']
        distanceLabel:
          type: string
          description: Approximate, like "~4 mi away" or "Under 1 mi away". Never an exact distance.
        plays:
          type: [string, 'null']
          enum: [singles, doubles, both, null]
        played:
          type: integer
          description: Completed matches on Ball Boi
        noShows:
          type: integer
          description: Match requests where the other player said they didn't show
      required: [userId, name, avatarUrl, rating, ratingSource, distanceLabel, plays, played, noShows]
    DiscoverPlayer:
      allOf:
      - $ref: '#/components/schemas/DiscoverPlayerCard'
      - type: object
        properties:
          freeTimes:
            type: array
            items:
              type: string
              enum: [weekday_mornings, weekday_evenings, weekends]
          homeCourt:
            oneOf:
            - $ref: '#/components/schemas/HomeCourt'
            - type: 'null'
        required: [freeTimes, homeCourt]
    DiscoverPlayers:
      type: object
      properties:
        filters:
          $ref: '#/components/schemas/DiscoverFilters'
        hidden:
          type: boolean
          description: Your own profile is hidden from Discover
        homeAreaProblem:
          type: [string, 'null']
          description: Why Discover can't place you yet (no home area, or a zip it can't place). Players is empty then.
        myRating:
          type: [number, 'null']
        counts:
          type: array
          items:
            type: object
            properties:
              radius:
                type: integer
              count:
                type: integer
            required: [radius, count]
        players:
          type: array
          items:
            $ref: '#/components/schemas/DiscoverPlayerCard'
      required: [filters, hidden, homeAreaProblem, myRating, counts, players]
    DiscoverSettings:
      type: object
      properties:
        hidden:
          type: boolean
        plays:
          type: [string, 'null']
          enum: [singles, doubles, both, null]
        freeTimes:
          type: array
          items:
            type: string
            enum: [weekday_mornings, weekday_evenings, weekends]
        homeCourt:
          oneOf:
          - $ref: '#/components/schemas/HomeCourt'
          - type: 'null'
      required: [hidden, plays, freeTimes, homeCourt]
    DiscoverSettingsInput:
      type: object
      properties:
        hidden:
          type: boolean
        plays:
          type: [string, 'null']
          enum: [singles, doubles, both, null]
        freeTimes:
          type: array
          items:
            type: string
            enum: [weekday_mornings, weekday_evenings, weekends]
    LeagueMembership:
      type: object
      properties:
        leagueId:
          type: integer
        role:
          type: ["string", "null"]
          enum: [owner, co_admin, null]
        isAdmin:
          type: boolean
        playerId:
          type: ["integer", "null"]
        isPlaying:
          type: boolean
        hasLeft:
          type: boolean
        onlyAdmin:
          type: boolean
          description: The caller is this league's only admin. They can still leave; they stay admin and keep managing it
        joinedWeek:
          type: ["integer", "null"]
          description: For a player who joined after week 1, the week they joined ("You joined in week 3 of 8")
        seasonWeeks:
          type: ["integer", "null"]
      required: [leagueId, role, isAdmin, playerId, isPlaying, hasLeft, onlyAdmin, joinedWeek, seasonWeeks]

    ConfirmLeagueName:
      type: object
      properties:
        confirmName:
          type: string
          description: The league's name, typed to confirm
      required: [confirmName]

    EndedLeague:
      type: object
      properties:
        leagueId: { type: integer }
        status: { type: string }
        endedAt: { type: string }
        cancelledRounds: { type: integer }
      required: [leagueId, status, endedAt, cancelledRounds]

    LeagueNotice:
      type: object
      properties:
        id: { type: integer }
        message: { type: string }
        createdAt: { type: string }
      required: [id, message, createdAt]

    LeagueAdmin:
      type: object
      properties:
        clerkUserId:
          type: string
        role:
          type: string
          enum: [owner, co_admin]
        playerId:
          type: ["integer", "null"]
        name:
          type: string
      required: [clerkUserId, role, playerId, name]

    RosterPlayer:
      type: object
      properties:
        playerId:
          type: integer
        name:
          type: string
          description: The player's profile name if they're on Ball Boi, else the name the admin typed
        skillLevel:
          type: string
          description: The level pairing uses, like "3.5". A signed-up player's profile level; a placeholder's admin-set level
        rating:
          description: A signed-up player's profile level and its source, for the level badge. Null for placeholders and players who haven't set one
          oneOf:
            - $ref: "#/components/schemas/MatchPlayerRating"
            - type: "null"
        hasAccount:
          type: boolean
          description: False for players an admin added by name; they can't be co-admins
        role:
          type: ["string", "null"]
          enum: [owner, co_admin, null]
      required: [playerId, name, skillLevel, rating, hasAccount, role]

    PlayerIdBody:
      type: object
      properties:
        playerId:
          type: integer
      required: [playerId]

    SwapPlayersBody:
      type: object
      properties:
        playerAId:
          type: integer
        playerBId:
          type: integer
      required: [playerAId, playerBId]

    LockMatchBody:
      type: object
      properties:
        locked:
          type: boolean
      required: [locked]

    EnterScoreBody:
      type: object
      properties:
        score:
          type: string
          description: >-
            Sets from your own side, like "6-3, 4-6, 10-7". Your games first. Best of three;
            a set ends 6-0 to 6-4, 7-5 or 7-6, and a third set can be a match tiebreak (10-7).
        retired:
          type: boolean
          description: >-
            The opponent retired. The score is the sets so far (the last can be unfinished),
            it counts as the caller's win, and it's stored with RET at the end, like "6-3, 2-1 RET".
            Admin corrections ignore it.
      required: [score]

    SettleMatchBody:
      type: object
      description: Either a score from player 1's side, or a walkover to one of the two players.
      properties:
        score:
          type: string
          description: Sets from player 1's side, like "6-3, 6-4"
        walkoverWinnerId:
          type: ["integer", "null"]
          description: The player who wins on a walkover (W/O)

    ScoreResult:
      type: object
      properties:
        matchId:
          type: integer
        status:
          type: string
        score:
          type: ["string", "null"]
          description: Stored from player 1's side
        winnerId:
          type: ["integer", "null"]
        inGrace:
          type: boolean
          description: Scored in the grace week; counts for ratings and stats, not standings
        countsForStandings:
          type: boolean
      required: [matchId, status, score, winnerId, inGrace, countsForStandings]

    MyJoinRequest:
      type: object
      properties:
        id: { type: integer }
        leagueId: { type: integer }
        leagueName: { type: string }
        kind:
          type: string
          enum: [request, waitlist]
        status:
          type: string
          enum: [pending, declined]
        createdAt: { type: string }
        decidedAt: { type: ["string", "null"] }
      required: [id, leagueId, leagueName, kind, status, createdAt, decidedAt]

    LeagueWeekItem:
      type: object
      properties:
        leagueId: { type: integer }
        leagueName: { type: string }
        roundId: { type: integer }
        roundNumber: { type: integer }
        phase:
          type: string
          enum: [upcoming, open, grace]
        startDate: { type: string }
        deadline: { type: string }
        graceEnd: { type: string }
