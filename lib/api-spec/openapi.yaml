          maximum: 6
          description: A club's weekly match day, 0 Sunday to 6 Saturday. Null when players pick their own time.
        matchTime:
          type: ["string", "null"]
          description: A club's weekly match time, 24-hour HH:MM in the league's time zone. Null when players pick.
      required:
        - id
        - name
        - format
        - status
        - timeZone
        - playerCount
        - visibility
        - playoffSize
        - unplayedRule
        - matchCount
        - createdAt
        - updatedAt

    CreateLeagueBody:
      type: object
      description: >-
        Start a league (spec: Leagues > Setup). Anyone signed in can start one and
        becomes its admin. With playing true, the admin also joins as a player.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        description:
          type: ["string", "null"]
        format:
          type: string
          enum: ["flex", "round_robin", "elimination", "swiss"]
        status:
          type: string
          enum: ["active", "completed", "upcoming"]
        leagueType:
          type: string
          enum: ["singles", "doubles"]
        partnerMode:
          type: ["string", "null"]
          enum: ["fixed", "rotating", null]
        visibility:
          type: string
          enum: ["private", "open"]
        minRating:
          type: ["string", "null"]
        maxRating:
          type: ["string", "null"]
        rosterCap:
          type: ["integer", "null"]
          minimum: 2
          maximum: 64
        startDate:
          type: string
          description: First day of the season, YYYY-MM-DD
        seasonWeeks:
          type: integer
          minimum: 1
          maximum: 24
        playoffSize:
          type: integer
          enum: [0, 4, 8]
        unplayedRule:
          type: string
          enum: ["forfeit", "no_result"]
          deprecated: true
          description: Ignored. Every league has a fixed 1-week grace period (decision 25).
        location:
          type: ["string", "null"]
        playing:
          type: boolean
          description: The admin plays in the league too (default true)
        playerName:
          type: ["string", "null"]
          description: The admin's name in the league, when playing
        skillLevel:
          type: ["string", "null"]
        timeZone:
          type: ["string", "null"]
          description: The creator's phone time zone (IANA name). The league runs on it. Eastern when missing.
        matchDay:
          type: ["integer", "null"]
          minimum: 0
          maximum: 6
          description: Weekly match day, 0 Sunday to 6 Saturday. Send with matchTime, or leave both out so players pick.
        matchTime:
          type: ["string", "null"]
          description: Weekly match time, 24-hour HH:MM in the league's time zone.
      required:
        - name
        - format
        - startDate
        - seasonWeeks

