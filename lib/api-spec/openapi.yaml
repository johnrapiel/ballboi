        player1:
          oneOf:
            - $ref: "#/components/schemas/BracketSeed"
            - type: "null"
        player2:
          oneOf:
            - $ref: "#/components/schemas/BracketSeed"
            - type: "null"
        status:
          type: string
          description: scheduled, completed, or waiting (no match yet)
        score:
          type: ["string", "null"]
