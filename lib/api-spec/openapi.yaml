      required: [name, address]
    LeagueMembership:
      type: object
      properties:
        leagueId:
          type: integer
        role:
          type: ["string", "null"]
          enum: [owner, co_admin, null]
        isAdmin:
          type: boolean
        playerId:
          type: ["integer", "null"]
        isPlaying:
          type: boolean
        hasLeft:
          type: boolean
        onlyAdmin:
          type: boolean
          description: The caller is this league's only admin. They can still leave; they stay admin and keep managing it
        joinedWeek:
          type: ["integer", "null"]
          description: For a player who joined after week 1, the week they joined ("You joined in week 3 of 8")
        seasonWeeks:
          type: ["integer", "null"]
      required: [leagueId, role, isAdmin, playerId, isPlaying, hasLeft, onlyAdmin, joinedWeek, seasonWeeks]

    ConfirmLeagueName:
      type: object
      properties:
        confirmName:
          type: string
          description: The league's name, typed to confirm
      required: [confirmName]

    EndedLeague:
      type: object
      properties:
        leagueId: { type: integer }
        status: { type: string }
        endedAt: { type: string }
        cancelledRounds: { type: integer }
      required: [leagueId, status, endedAt, cancelledRounds]

    LeagueNotice:
      type: object
      properties:
        id: { type: integer }
        message: { type: string }
        createdAt: { type: string }
      required: [id, message, createdAt]

    LeagueAdmin:
      type: object
      properties:
        clerkUserId:
          type: string
        role:
          type: string
          enum: [owner, co_admin]
        playerId:
          type: ["integer", "null"]
        name:
          type: string
      required: [clerkUserId, role, playerId, name]

    RosterPlayer:
      type: object
      properties:
        playerId:
          type: integer
        name:
          type: string
          description: The player's profile name if they're on Ball Boi, else the name the admin typed
        skillLevel:
          type: string
          description: The level pairing uses, like "3.5". A signed-up player's profile level; a placeholder's admin-set level
        rating:
          description: A signed-up player's profile level and its source, for the level badge. Null for placeholders and players who haven't set one
          oneOf:
            - $ref: "#/components/schemas/MatchPlayerRating"
            - type: "null"
        hasAccount:
          type: boolean
          description: False for players an admin added by name; they can't be co-admins
        role:
          type: ["string", "null"]
          enum: [owner, co_admin, null]
      required: [playerId, name, skillLevel, rating, hasAccount, role]

    PlayerIdBody:
      type: object
      properties:
        playerId:
          type: integer
      required: [playerId]

    SwapPlayersBody:
      type: object
      properties:
        playerAId:
          type: integer
        playerBId:
          type: integer
      required: [playerAId, playerBId]

    LockMatchBody:
      type: object
      properties:
        locked:
          type: boolean
      required: [locked]

    EnterScoreBody:
      type: object
      properties:
        score:
          type: string
          description: >-
            Sets from your own side, like "6-3, 4-6, 10-7". Your games first. Best of three;
            a set ends 6-0 to 6-4, 7-5 or 7-6, and a third set can be a match tiebreak (10-7).
        retired:
          type: boolean
          description: >-
            The opponent retired. The score is the sets so far (the last can be unfinished),
            it counts as the caller's win, and it's stored with RET at the end, like "6-3, 2-1 RET".
            Admin corrections ignore it.
      required: [score]

    SettleMatchBody:
      type: object
      description: Either a score from player 1's side, or a walkover to one of the two players.
      properties:
        score:
          type: string
          description: Sets from player 1's side, like "6-3, 6-4"
        walkoverWinnerId:
          type: ["integer", "null"]
          description: The player who wins on a walkover (W/O)

    ScoreResult:
      type: object
      properties:
        matchId:
          type: integer
        status:
          type: string
        score:
          type: ["string", "null"]
          description: Stored from player 1's side
        winnerId:
          type: ["integer", "null"]
        inGrace:
          type: boolean
          description: Scored in the grace week; counts for ratings and stats, not standings
        countsForStandings:
          type: boolean
      required: [matchId, status, score, winnerId, inGrace, countsForStandings]

    MyJoinRequest:
      type: object
      properties:
        id: { type: integer }
        leagueId: { type: integer }
        leagueName: { type: string }
        kind:
          type: string
          enum: [request, waitlist]
        status:
          type: string
          enum: [pending, declined]
        createdAt: { type: string }
        decidedAt: { type: ["string", "null"] }
      required: [id, leagueId, leagueName, kind, status, createdAt, decidedAt]

    LeagueWeekItem:
      type: object
      properties:
        leagueId: { type: integer }
        leagueName: { type: string }
        roundId: { type: integer }
        roundNumber: { type: integer }
        phase:
          type: string
          enum: [upcoming, open, grace]
        startDate: { type: string }
        deadline: { type: string }
        graceEnd: { type: string }
        bye: { type: boolean }
        matchId: { type: ["integer", "null"] }
        myPlayerId: { type: integer }
        opponentName: { type: ["string", "null"] }
        opponentPlayerId:
          type: ["integer", "null"]
          description: The singles opponent's player id, for Message on the Home card; null for doubles and byes
        singles: { type: boolean }
        scheduledAt: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        played:
          type: boolean
          description: A score is in, so there's nothing left to enter or record
        timeZone:
          type: string
          description: The league's time zone, for its deadlines
      required: [leagueId, leagueName, roundId, roundNumber, phase, startDate, deadline, graceEnd, bye, matchId, myPlayerId, opponentName, opponentPlayerId, singles, scheduledAt, location, played, timeZone]

    LeagueWeekPlayoff:
      type: object
      properties:
        leagueId: { type: integer }
        leagueName: { type: string }
        matchId: { type: integer }
        round: { type: string }
        opponentName: { type: string }
        opponentPlayerId:
          type: ["integer", "null"]
          description: The singles opponent's player id, for Message on the Home card; null for doubles
        singles: { type: boolean }
        timeZone: { type: string }
        playBy:
          type: ["string", "null"]
          description: Last day to play this playoff round (two weeks per round)
        pastPlayBy:
          type: boolean
          description: The play-by date has passed, so the league admin enters the result
        scheduledAt: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
      required: [leagueId, leagueName, matchId, round, opponentName, opponentPlayerId, singles, timeZone, playBy, pastPlayBy, scheduledAt, location]

    LeagueWeekDraft:
      type: object
      properties:
        leagueId: { type: integer }
        leagueName: { type: string }
        roundId: { type: integer }
        roundNumber: { type: integer }
        startDate: { type: string }
        timeZone:
          type: string
          description: The league's time zone. The round goes out at 7am there.
      required: [leagueId, leagueName, roundId, roundNumber, startDate, timeZone]

    SetMatchTimeBody:
      type: object
      properties:
        scheduledAt:
          type: ["string", "null"]
          description: ISO date and time inside the match's week (league time zone), or null to clear it
      required: [scheduledAt]

    MatchTime:
      type: object
      properties:
        matchId: { type: integer }
        scheduledAt: { type: ["string", "null"] }
        timeZone: { type: string }
      required: [matchId, scheduledAt, timeZone]

    LeagueMatchTimeBody:
      type: object
      description: Both set for a weekly match day and time, or both null so players pick.
      properties:
        matchDay:
          type: ["integer", "null"]
          minimum: 0
          maximum: 6
        matchTime:
          type: ["string", "null"]
          description: 24-hour HH:MM in the league's time zone
      required: [matchDay, matchTime]

    LeagueMatchTime:
      type: object
      properties:
        matchDay: { type: ["integer", "null"] }
        matchTime: { type: ["string", "null"] }
        timeZone: { type: string }
      required: [matchDay, matchTime, timeZone]

