                  $ref: '#/components/schemas/RecordingOpponent'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Couldn't load
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /recording/quick-matches:
    post:
      operationId: createQuickMatch
      tags: [recording]
      summary: Start a Quick match against a picked player, or a typed name (which makes an invite link)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuickMatchInput'
      responses:
        '201':
          description: Match made
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickMatchCreated'
        '400':
          description: Doubles, both or neither of player and name, or name too long
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The picked player isn't one you can record against
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Couldn't start the match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /recording/quick-matches/{matchId}/score:
    post:
      operationId: scoreQuickMatch
      tags: [recording]
      summary: Enter a Quick match's score from your side. The first score entered stands.
      parameters:
