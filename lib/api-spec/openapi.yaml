        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      description: >-
        Every error answers with this: a message to show, and on some routes a code to branch on.
        Routes need a signed-in Clerk session unless they say otherwise, and answer 401 without one.
        A banned or suspended account gets 403 with code account_banned or account_suspended on
        every route except GET /account/status, POST /account/appeal, DELETE /users/me,
        GET /users/me/league-handoff and /healthz. 401, that 403 and 500 are not listed per route.
      properties:
        error:
          type: string
          description: A message to show the person
        code:
          type: string
          description: Present on some errors, such as league_ended, blocked or already_appealed
      required:
        - error

