openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Tennis League Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: dev
    description: Development-only walkthrough tools. Not available in production.
  - name: discover
    description: Players near you, Open leagues, Open matches and the court directory
  - name: health
    description: Health operations
  - name: leagues
    description: League management
  - name: players
    description: Player management
  - name: matches
    description: Match scheduling and results
  - name: availability
    description: Player availability and reminder operations
  - name: stats
    description: Statistics and analytics
  - name: users
    description: User profile management
  - name: ball-boi
    description: Ball Boi match recording and replay analysis
  - name: rounds
    description: Round-based match scheduling
  - name: seasons
    description: Season management
  - name: safety
    description: Blocking and reporting
  - name: moderation
    description: The moderator's tools. Only the app's moderator account can use them.
  - name: account
    description: Ban and suspension status and the one appeal. These work while banned.
  - name: messages
    description: Player-to-player messages
  - name: recording
    description: Recording consent, Quick matches and the recordings list
  - name: support
    description: "\"Something not working?\" reports"
  - name: notifications
    description: Push notification registration
  - name: storage
    description: Profile photo uploads and loads

paths:
  /courts:
    get:
      operationId: listCourts
      tags: [discover]
      summary: The court directory, nearest first, searchable
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 60
      responses:
        '200':
          description: Courts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourtList'
        '500':
          description: Couldn't load courts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: addCourt
      tags: [discover]
      summary: Add a missing court with a name and an address (the address needs its ZIP). The same name in the same ZIP returns the court that's there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCourtInput'
      responses:
        '200':
          description: Already in the directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddedCourt'
        '201':
          description: Added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddedCourt'
        '400':
          description: A name or address we can't use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many courts added today
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /courts/home:
    get:
      operationId: getHomeCourt
      tags: [discover]
      summary: Your home court
      responses:
        '200':
          description: Your home court, or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeCourt'
    put:
      operationId: setHomeCourt
      tags: [discover]
      summary: Set or clear your home court
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeCourtInput'
      responses:
        '200':
          description: Your home court, or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeCourt'
        '404':
          description: Not in the directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /dev/match-plans/{id}/shift:
    post:
      operationId: shiftMatchPlan
      tags: [discover]
      summary: Dev only, move a match card's times earlier by some hours to try the day-before and after-match steps now
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchPlanShiftInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchPlan'
        '409':
          description: Not possible now (the reason is in error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /match-plans:
    post:
      operationId: sendMatchPlan
      tags: [discover]
      summary: Send a match card in a chat (a newer card replaces an older one still waiting)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMatchPlanInput'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchPlan'
        '409':
          description: Not possible now (the reason is in error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /match-plans/upcoming:
    get:
      operationId: listUpcomingMatchPlans
      tags: [discover]
      summary: Your added Discover matches still to play, for Home and My matches
      responses:
        '200':
          description: Matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpcomingMatchPlans'
  /match-plans/with/{userId}:
    get:
      operationId: getMatchPlansWithUser
      tags: [discover]
      summary: The match cards in your chat with a player, and what you can do with each
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Cards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchPlansWithUser'
        '404':
          description: No such player
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /match-plans/{id}/{command}:
    post:
      operationId: actOnMatchPlan
      tags: [discover]
      summary: "Answer a match card: accept, decline, undo, still-on, cancel, not-played, no-show, dispute or admit"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: command
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchPlan'
        '409':
          description: Not possible now (the reason is in error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /open-matches:
    get:
      operationId: listOpenMatches
      tags: [discover]
      summary: Open matches near you, soonest first, with a count per distance chip
      parameters:
      - name: radius
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 30
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenMatchList'
    post:
      operationId: postOpenMatch
      tags: [discover]
      summary: Post an open match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOpenMatchInput'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenMatchDetail'
        '400':
          description: A time that has passed, or another problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /open-matches/mine:
    get:
      operationId: listMyOpenMatches
      tags: [discover]
      summary: Open matches you posted or hold a spot in, still to play, for Home
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyOpenMatches'
  /open-matches/{id}:
    get:
      operationId: getOpenMatch
      tags: [discover]
      summary: One open match, who's in, and what you can do
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenMatchDetail'
  /open-matches/{id}/messages:
    get:
      operationId: getOpenMatchMessages
      tags: [discover]
      summary: The group chat of a filled open match (add ?after=<id> for only newer lines)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenMatchMessages'
  /open-matches/{id}/{action}:
    post:
      operationId: actOnOpenMatch
      tags: [discover]
      summary: "join, drop, remove (poster; body userId), cancel (poster), or messages (send to the group chat; body text)"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: action
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenMatchActionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenMatchDetail'
        '409':
          description: Not possible now (code filled when the last spot just went)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /discover/area:
    put:
      operationId: setDiscoverArea
      tags: [discover]
      summary: Change your home ZIP from Discover. Also updates your profile's home area.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverAreaInput'
      responses:
        '200':
          description: Your Discover settings with the new area
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverMe'
        '400':
          description: "We couldn't find that ZIP"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /discover/availability:
    put:
      operationId: saveDiscoverAvailability
      tags: [discover]
      summary: Save the "When you can play" grid (a Monday to Sunday week of hours)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverAvailabilityInput'
      responses:
        '200':
          description: Your Discover settings with the new hours
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverMe'
        '400':
          description: An hour outside the grid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /discover/leagues:
    get:
      operationId: listDiscoverLeagues
      tags: [discover]
      summary: Open leagues near you, nearest first, with a count for each distance chip
      parameters:
      - name: radius
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 30
      responses:
        '200':
          description: Open leagues near you
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverLeagues'
        '500':
          description: Couldn't load leagues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /discover/leagues/{leagueId}:
    get:
      operationId: getDiscoverLeague
      tags: [discover]
      summary: An Open league's Discover page, and where you stand with it
      parameters:
      - name: leagueId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: The league
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverLeague'
        '404':
          description: Not an Open league any more
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /discover/me:
    get:
      operationId: getDiscoverMe
      tags: [discover]
      summary: Your area, hidden profile, plays, last distance and hours, for Discover
      responses:
        '200':
          description: Your Discover settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverMe'
        '404':
          description: No profile yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /discover/players:
    get:
      operationId: listDiscoverPlayers
      tags: [discover]
      summary: Players near you, nearest first, with a count for each distance chip
      description: >-
        Never you, hidden players, anyone blocked either way, or banned and
        suspended accounts. Distances are approximate whole miles between home
        ZIP centers. The app saves a distance you pick with PUT /discover/settings.
      parameters:
      - name: radius
        in: query
        required: false
        description: Miles, 1 to 30. Defaults to your last distance.
        schema:
          type: integer
          minimum: 1
          maximum: 30
      - name: level
        in: query
        required: false
        description: close (within 0.5), wider (within 1.0) or any
        schema:
          type: string
          enum: [close, wider, any]
      - name: plays
        in: query
        required: false
        schema:
          type: string
          enum: [singles, doubles, either]
      - name: free
        in: query
        required: false
        description: '"1" keeps players whose hours overlap yours. Ignored until you set times.'
        schema:
          type: string
      responses:
        '200':
          description: Players near you
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverPlayers'
        '500':
          description: Couldn't load players
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /discover/players/{userId}:
    get:
      operationId: getDiscoverPlayer
      tags: [discover]
      summary: A player card from Discover
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: The player card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverPlayerCard'
        '404':
          description: Not in Discover for you (hidden, blocked, or gone)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /discover/players/{userId}/block:
    post:
      operationId: blockDiscoverPlayer
      tags: [discover]
      summary: Block a player by user id ("Also block" on a message report from a player with no league player record)
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Blocked
        '404':
          description: No such player, or yourself
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: unblockDiscoverPlayer
      tags: [discover]
      summary: Unblock a player by user id, from a blocked chat
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Unblocked (or wasn't blocked)
  /discover/players/{userId}/report:
    post:
      operationId: reportDiscoverPlayer
      tags: [discover]
      summary: Report a player by user id, and optionally block them in the same step (F3, F9)
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverReportInput'
      responses:
        '201':
          description: Report filed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverReportResult'
        '400':
          description: No reason, or Something else without a note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such player, or yourself
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /discover/settings:
    put:
      operationId: saveDiscoverSettings
      tags: [discover]
      summary: Show me in Discover, what you play, and your last distance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverSettingsInput'
      responses:
        '200':
          description: Your Discover settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverMe'
        '400':
          description: A value that isn't allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /leagues:
    get:
      operationId: getLeagues
      tags: [leagues]
      summary: List all leagues
      parameters:
        - name: clerkUserId
          in: query
          required: false
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of leagues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/League"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createLeague
      tags: [leagues]
      summary: Create a new league
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeagueBody"
      responses:
        "201":
          description: Created league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{leagueId}:
    get:
      operationId: getLeague
      tags: [leagues]
      summary: Get league by ID
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: League
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateLeague
      tags: [leagues]
      summary: Update league
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeagueBody"
      responses:
        "200":
          description: Updated league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteLeague
      tags: [leagues]
      summary: League admins delete the league, with its name typed. Members get a note; Ball Boi recordings stay with the players.
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmLeagueName"
      responses:
        "204":
          description: Deleted
        "400":
          description: The typed name doesn't match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a league admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{leagueId}/reset:
    post:
      operationId: resetLeagueRecords
      tags: [leagues]
      summary: Reset round scheduling history for a league (admin only). Match history is preserved.
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rounds reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: object
                    properties:
                      rounds:
                        type: integer
                    required: [rounds]
                required: [deleted]
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{leagueId}/playoffs/generate:
    post:
      operationId: generateLeaguePlayoffs
      tags: [leagues]
      summary: Generate a playoff bracket for a league (admin only)
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Bracket generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayoffBracketResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{leagueId}/playoffs:
    get:
      operationId: getLeaguePlayoffs
      tags: [leagues]
      summary: Get the playoff bracket and eligibility status for a league
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Playoff status including bracket (or null) and eligibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayoffsStatusResponse"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{leagueId}/rounds/generate:
    post:
      operationId: generateLeagueRound
      tags: [rounds]
      summary: Generate next round of matchups for a league (admin only)
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: Force generation even if a round is still active
      responses:
        "201":
          description: Round generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueRoundWithMatchups"
        "400":
          description: "Invalid id or input"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "Not allowed: a private league you're not in, or not one of its admins"
          content:
            application/json:
              schema:
