openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Tennis League Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leagues
    description: League management
  - name: players
    description: Player management
  - name: matches
    description: Match scheduling and results
  - name: availability
    description: Player availability and reminder operations
  - name: stats
    description: Statistics and analytics
  - name: users
    description: User profile management
  - name: ball-boi
    description: Ball Boi match recording and replay analysis
  - name: rounds
    description: Round-based match scheduling
  - name: seasons
    description: Season management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /leagues:
    get:
      operationId: getLeagues
      tags: [leagues]
      summary: List all leagues
      parameters:
        - name: clerkUserId
          in: query
          required: false
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of leagues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/League"
    post:
      operationId: createLeague
      tags: [leagues]
      summary: Create a new league
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeagueBody"
      responses:
        "201":
          description: Created league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"

  /leagues/{leagueId}:
    get:
      operationId: getLeague
      tags: [leagues]
      summary: Get league by ID
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: League
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateLeague
      tags: [leagues]
      summary: Update league
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeagueBody"
      responses:
        "200":
          description: Updated league
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
    delete:
      operationId: deleteLeague
      tags: [leagues]
      summary: Delete league
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /leagues/{leagueId}/reset:
    post:
      operationId: resetLeagueRecords
      tags: [leagues]
      summary: Reset round scheduling history for a league (admin only). Match history is preserved.
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rounds reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: object
                    properties:
                      rounds:
                        type: integer
                    required: [rounds]
                required: [deleted]
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{leagueId}/playoffs/generate:
    post:
      operationId: generateLeaguePlayoffs
      tags: [leagues]
      summary: Generate a playoff bracket for a league (admin only)
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Bracket generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayoffBracketResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{leagueId}/playoffs:
    get:
      operationId: getLeaguePlayoffs
      tags: [leagues]
      summary: Get the playoff bracket and eligibility status for a league
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Playoff status including bracket (or null) and eligibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayoffsStatusResponse"

  /leagues/{leagueId}/rounds/generate:
    post:
      operationId: generateLeagueRound
      tags: [rounds]
      summary: Generate next round of matchups for a league (admin only)
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  description: Force generation even if a round is still active
      responses:
        "201":
          description: Round generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueRoundWithMatchups"
        "409":
          description: A round is already active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{leagueId}/rounds/current:
    get:
      operationId: getCurrentLeagueRound
      tags: [rounds]
      summary: Get the current active round for a league
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Current round or null if no active round
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LeagueRoundWithMatchups"
                  - type: "null"

  /leagues/{leagueId}/rounds:
    get:
      operationId: getLeagueRounds
      tags: [rounds]
      summary: List all rounds for a league
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of rounds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeagueRoundWithMatchups"

  /leagues/{leagueId}/seasons:
    get:
      operationId: getLeagueSeasons
      tags: [seasons]
      summary: List seasons visible to a league (own + global)
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of seasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Season"
    post:
      operationId: createLeagueSeason
      tags: [seasons]
      summary: Create a season for a league (admin only)
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSeasonBody"
      responses:
        "201":
          description: Created season
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leagues/{leagueId}/seasons/active:
    get:
      operationId: getActiveLeagueSeason
      tags: [seasons]
      summary: Get the currently active season for a league
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Active season or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Season"
                  - type: "null"

  /seasons/{id}:
    patch:
      operationId: updateSeason
      tags: [seasons]
      summary: Update a season (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSeasonBody"
      responses:
        "200":
          description: Updated season
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSeason
      tags: [seasons]
      summary: Delete a season (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /leagues/{leagueId}/standings:
    get:
      operationId: getLeagueStandings
      tags: [leagues]
      summary: Get standings for a league
      parameters:
        - name: leagueId
          in: path
          required: true
          schema:
            type: integer
        - name: season
          in: query
          required: false
          description: Filter by season name, or "all" for all-time aggregate
          schema:
            type: string
      responses:
        "200":
          description: Standings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Standing"

  /players:
    get:
      operationId: getPlayers
      tags: [players]
      summary: List all players
      parameters:
        - name: leagueId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"

  /players/me:
    get:
      operationId: getMyPlayers
      tags: [players]
      summary: List player records linked to the current user
      responses:
        "200":
          description: Current user's player records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /players/{playerId}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Get player by ID
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePlayer
      tags: [players]
      summary: Update player
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlayerBody"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
    delete:
      operationId: deletePlayer
      tags: [players]
      summary: Delete player
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /players/{playerId}/stats:
    get:
      operationId: getPlayerStats
      tags: [players]
      summary: Get detailed stats for a player
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerStats"

  /leagues/{leagueId}/membership:
    get:
      operationId: getLeagueMembership
      tags: [leagues]
      summary: The signed-in user's admin role and player row in a league
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
      responses:
        "200":
          description: Membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueMembership"

  /leagues/{leagueId}/admins:
    get:
      operationId: getLeagueAdmins
      tags: [leagues]
      summary: The league's owner and co-admins
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
      responses:
        "200":
          description: Admins, owner first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeagueAdmin"
    post:
      operationId: promoteLeagueAdmin
      tags: [leagues]
      summary: Promote a league member to co-admin (admins only)
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerIdBody"
      responses:
        "201":
          description: Promoted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueAdmin"

  /leagues/{leagueId}/roster:
    get:
      operationId: getLeagueRoster
      tags: [leagues]
      summary: Everyone playing this season, with their admin role (admins only)
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
      responses:
        "200":
          description: Active players by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RosterPlayer"

  /leagues/{leagueId}/admins/{clerkUserId}:
    delete:
      operationId: removeLeagueAdmin
      tags: [leagues]
      summary: Remove a co-admin (the owner), or step down (a co-admin)
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
        - name: clerkUserId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed

  /leagues/{leagueId}/schedule:
    get:
      operationId: getLeagueSchedule
      tags: [leagues]
      summary: Every round of the season, plus weeks still to come
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
      responses:
        "200":
          description: Schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeagueSchedule"

  /leagues/{leagueId}/matches/{matchId}/score:
    post:
      operationId: enterLeagueScore
      tags: [leagues]
      summary: Enter a league match score from your own side. The first score entered stands.
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnterScoreBody"
      responses:
        "201":
          description: Score saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreResult"
        "409":
          description: A score is already in, or the match can't be scored now

  /leagues/{leagueId}/join-requests:
    get:
      operationId: getLeagueJoinRequests
      tags: [leagues]
      summary: Pending requests and the waitlist (admins only)
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
      responses:
        "200":
          description: Pending requests, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JoinRequest"
    post:
      operationId: requestToJoinLeague
      tags: [leagues]
      summary: Ask to join an Open league. Goes to the waitlist once the season has started or the league is full.
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinLeagueBody"
      responses:
        "201":
          description: Request sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinRequest"
        "202":
          description: On the waitlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinRequest"

  /leagues/{leagueId}/join-requests/me:
    get:
      operationId: getMyLeagueJoinRequest
      tags: [leagues]
      summary: Your own pending request or waitlist spot
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
      responses:
        "200":
          description: The request, or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/JoinRequest"
                  - type: "null"
    delete:
      operationId: withdrawLeagueJoinRequest
      tags: [leagues]
      summary: Withdraw your request or leave the waitlist
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
      responses:
        "204":
          description: Withdrawn

  /leagues/{leagueId}/join-requests/{requestId}/approve:
    post:
      operationId: approveLeagueJoinRequest
      tags: [leagues]
      summary: Approve a request before the season starts (admins only)
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
        - $ref: "#/components/parameters/RequestIdParam"
      responses:
        "201":
          description: Player added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovedPlayer"

  /leagues/{leagueId}/join-requests/{requestId}/decline:
    post:
      operationId: declineLeagueJoinRequest
      tags: [leagues]
      summary: Decline a request or remove someone from the waitlist (admins only)
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
        - $ref: "#/components/parameters/RequestIdParam"
      responses:
        "204":
          description: Declined

  /leagues/{leagueId}/leave:
    post:
      operationId: leaveLeague
      tags: [leagues]
      summary: Leave a league. Played matches stay; remaining matches are voided.
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
      responses:
        "200":
          description: Left
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DropoutResult"

  /leagues/{leagueId}/players/{playerId}/remove:
    post:
      operationId: removeLeaguePlayer
      tags: [leagues]
      summary: Remove a player (admins only). Same rules as leaving.
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DropoutResult"

  /leagues/{leagueId}/rounds/draft-next:
    post:
      operationId: draftNextLeagueRound
      tags: [leagues]
      summary: Draft the next round's pairings now (admins only)
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
      responses:
        "200":
          description: The draft round
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleRound"

  /leagues/{leagueId}/rounds/{roundId}/repair:
    post:
      operationId: repairLeagueRound
      tags: [leagues]
      summary: Re-pair a draft, keeping locked matches and admin byes (admins only)
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
        - $ref: "#/components/parameters/RoundIdParam"
      responses:
        "200":
          description: The draft round
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleRound"

  /leagues/{leagueId}/rounds/{roundId}/publish:
    post:
      operationId: publishLeagueRound
      tags: [leagues]
      summary: Send a draft out to players now (admins only)
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
        - $ref: "#/components/parameters/RoundIdParam"
      responses:
        "200":
          description: The published round
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleRound"

  /leagues/{leagueId}/rounds/{roundId}/swap:
    post:
      operationId: swapLeagueRoundPlayers
      tags: [leagues]
      summary: Swap two players' places in a draft (admins only)
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
        - $ref: "#/components/parameters/RoundIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwapPlayersBody"
      responses:
        "200":
          description: The draft round
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleRound"

  /leagues/{leagueId}/rounds/{roundId}/byes:
    post:
      operationId: addLeagueRoundBye
      tags: [leagues]
      summary: Give a player a bye in a draft (admins only)
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
        - $ref: "#/components/parameters/RoundIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerIdBody"
      responses:
        "200":
          description: The draft round
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleRound"

  /leagues/{leagueId}/rounds/{roundId}/byes/{playerId}:
    delete:
      operationId: removeLeagueRoundBye
      tags: [leagues]
      summary: Take a bye away in a draft (admins only)
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
        - $ref: "#/components/parameters/RoundIdParam"
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The draft round
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleRound"

  /leagues/{leagueId}/rounds/{roundId}/matches/{matchId}/lock:
    post:
      operationId: lockLeagueRoundMatch
      tags: [leagues]
      summary: Lock or unlock a pairing in a draft (admins only)
      parameters:
        - $ref: "#/components/parameters/LeagueIdParam"
        - $ref: "#/components/parameters/RoundIdParam"
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LockMatchBody"
      responses:
        "200":
          description: The draft round
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleRound"

  /matches:
    get:
      operationId: getMatches
      tags: [matches]
      summary: List matches
      parameters:
        - name: leagueId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
        - name: playerId
          in: query
          required: false
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          required: false
          schema:
            type: ["string", "null"]
            enum: ["scheduled", "in_progress", "completed", "cancelled", null]
      responses:
        "200":
          description: List of matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"
    post:
      operationId: createMatch
      tags: [matches]
      summary: Schedule a new match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMatchBody"
      responses:
        "201":
          description: Created match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"

  /matches/{matchId}:
    get:
      operationId: getMatch
      tags: [matches]
      summary: Get match by ID
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMatch
      tags: [matches]
      summary: Update match (including recording score)
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMatchBody"
      responses:
        "200":
          description: Updated match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
    delete:
      operationId: deleteMatch
