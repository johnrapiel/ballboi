          description: Shown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourtHidden'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Court not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /match-requests:
    get:
      operationId: getMatchRequests
      tags: [matchRequests]
      summary: Your match requests, sent and received
      responses:
        '200':
          description: Your match requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchRequestList'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: sendMatchRequest
      tags: [matchRequests]
      summary: Ask a Discover player for a match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMatchRequest'
      responses:
        '201':
          description: Sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchRequest'
        '400':
          description: Something about the request needs fixing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not in your Discover
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: You already have an open request with them
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Daily limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /match-requests/{requestId}:
    get:
      operationId: getMatchRequest
      tags: [matchRequests]
      summary: One of your match requests
      parameters:
      - name: requestId
        in: path
