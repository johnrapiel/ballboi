          oneOf:
            - $ref: "#/components/schemas/LeagueWeekStreak"
            - type: "null"
      required: [wins, losses, played, streak]

    LeagueWeekStreak:
      type: object
      properties:
        won: { type: boolean }
        count: { type: integer }
      required: [won, count]

    LeagueWeekStandingRow:
      type: object
      properties:
        rank: { type: integer }
        playerId: { type: integer }
        playerName: { type: string }
        wins: { type: integer }
        losses: { type: integer }
        you: { type: boolean }
      required: [rank, playerId, playerName, wins, losses, you]

    LeagueWeekLeague:
      type: object
      properties:
        leagueId: { type: integer }
        leagueName: { type: string }
        location: { type: ["string", "null"] }
